// 1. Implement the linked list data structure using the prototype.

  // ...

// add the prototype methods
// ...

function Node(element) {
  this.element = element;
  this.next = undefined;
}

function LinkedList(equalsFn) {
  this.count = 0;          
  this.head = undefined;   
  this.equalsFn = equalsFn || function(a, b) { return a === b; }; 
}

LinkedList.prototype.push = function(element) {
  var node = new Node(element);
  var current;

  if (this.head == null) {
    this.head = node; 
  } else {
    current = this.head;
    while (current.next != null) {
      current = current.next; 
    }
    current.next = node; 
  }
  this.count++;
};

LinkedList.prototype.getElementAt = function(index) {
  if (index < 0 || index >= this.count) {
    return undefined;
  }
  var current = this.head;
  for (var i = 0; i < index; i++) {
    current = current.next;
  }
  return current;
};

LinkedList.prototype.indexOf = function(element) {
  var current = this.head;
  for (var i = 0; i < this.count; i++) {
    if (this.equalsFn(element, current.element)) {
      return i;
    }
    current = current.next;
  }
  return -1;
};

LinkedList.prototype.removeAt = function(index) {
  if (index < 0 || index >= this.count) {
    return undefined;
  }

  var current = this.head;

  if (index === 0) {
    this.head = current.next;
  } else {
    var previous = this.getElementAt(index - 1);
    current = previous.next;
    previous.next = current.next;
  }

  this.count--;
  return current.element;
};

LinkedList.prototype.remove = function(element) {
  var index = this.indexOf(element);
  return this.removeAt(index);
};

LinkedList.prototype.isEmpty = function() {
  return this.count === 0;
};

LinkedList.prototype.size = function() {
  return this.count;
};

LinkedList.prototype.toString = function() {
  if (this.head == null) {
    return '';
  }
  var objString = this.head.element;
  var current = this.head.next;
  while (current != null) {
    objString += ',' + current.element;
    current = current.next;
  }
  return objString;
};

var list = new LinkedList();

// 3. Implement a getNodeAt(position) method (using the prototype) that returns
//    the node in a linked list at a given position (make sure to return the
//    node and not the element!).

LinkedList.prototype.getNodeAt = function(index) {
  if (index >= 0 && index < this.count) {
    let current = this.head;
    for (let i = 0; i < index && current != null; i++) {
      current = current.next;
    }
    return current; 
  }
  return undefined;
};


// 4. Implement an appendNode(node) method (using the prototype) that appends a
//    node to a linked list (as opposed to an element!).

LinkedList.prototype.appendNode = function(node) {
  if (this.head == null) {
    this.head = node;
  } else {
    let current = this.head;
    while (current.next != null) {
      current = current.next;
    }
    current.next = node;
  }
};
