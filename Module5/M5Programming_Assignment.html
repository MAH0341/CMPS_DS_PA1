console.log("The binary and binary search trees");

function BinarySearchTree() {
  function Node(key) {
    this.key = key;
    this.left = null;
    this.right = null
  }

  // the root node
  var root = null;

  // helper functions
  function insertNode(node, newNode) {
    if (newNode.key < node.key) {
      // go to left
      if (node.left === null) {
        // no left node yet so assign
        node.left = newNode;
      }
      else {
        // move down tree and repeat
        insertNode(node.left, newNode);
      }
    }
    else {
      // go to right
      if (node.right === null) {
        // no right node yet so assign
        node.right = newNode;
      }
      else {
        // move down tree and repeat
        insertNode(node.right, newNode);
      }
    }
  }

  this.insert = function(key) {
    // insert new key in the tree
    var newNode = new Node(key);
    if (root === null) {
      // no nodes yet
      root = newNode;
    }
    else {
      // find insert location through insertNode
      insertNode(root, newNode);
    }
  };

  function searchNode(node, key) {
    if (node === null) {
      return false;
    }

    if (key < node.key) {
      return searchNode(node.left, key);
    } else if (key > node.key) {
      return searchNode(node.right, key);
    } else {
      return true;
    }
  }

  this.search = function(key) {
    return searchNode(root, key);
  };

  this.inOrderTraverse = function(callback) {
    // visit all nodes of the tree using in-order traversal
    // call callback with each key encountered
    if (node !== null) {
      inOrderTraverseNode(node.left, callback);
      callback(node.key);
      inOrderTraverseNode(node.right, callback);
    }
  }

  this.inOrderTraverse = function(callback) {
    inOrderTraverseNode(root, callback);
  };

  this.preOrderTraverse = function(callback) {
    // visit all nodes of the tree using pre-order traversal
    // call callback with each key encountered
    if (node !== null) {
      callback(node.key);
      preOrderTraverseNode(node.left, callback);
      preOrderTraverseNode(node.right, callback);
    }
  }

  this.preOrderTraverse = function(callback) {
    preOrderTraverseNode(root, callback);
  };

  this.postOrderTraverse = function(callback) {
    // visit all nodes of the tree using post-order traversal
    // call callback with each key encountered
    if (node !== null) {
      postOrderTraverseNode(node.left, callback);
      postOrderTraverseNode(node.right, callback);
      callback(node.key);
    }
  }

  this.postOrderTraverse = function(callback) {
    postOrderTraverseNode(root, callback);
  };

  this.min = function() {
    // return the minimum key in the tree
    var current = root;

    if (current === null) return null;

    while (current.left !== null) {
      current = current.left;
    }
    return current.key;
  };

  this.max = function() {
    // return the maximum key in the tree
    var current = root;

    if (current === null) return null;

    while (current.right !== null) {
      current = current.right;
    }
    return current.key;
  };

  function findMinNode(node) {
    while (node.left !== null) {
      node = node.left;
    }
    return node;
  }

  function removeNode(node, key) {
    if (node === null) {
      return null;
    }

    if (key < node.key) {
      node.left = removeNode(node.left, key);
      return node;
    } 
    else if (key > node.key) {
      node.right = removeNode(node.right, key);
      return node;
    } 
    else {
      // key equal — node found
      if (node.left === null && node.right === null) {
        return null;
      }
      if (node.left === null) {
        return node.right;
      }
      if (node.right === null) {
        return node.left;
      }

      // two children → replace with inorder successor
      var minRight = findMinNode(node.right);
      node.key = minRight.key;
      node.right = removeNode(node.right, minRight.key);
      return node;
    }
  }

  this.remove = function() {
    root = removeNode(root, key);
  };

  this.print = function() {
    function print(node) {
      // check if not is not null
      if (node !== null) {
        // text for left child
        var leftChild = node.left !== null ? node.left.key : "None";
        // text for right child
        var rightChild = node.right !== null ? node.right.key : "None";
        // print output
        console.log(leftChild + " <-- " + node.key + " --> " + rightChild);
        // traverse left
        print(node.left);
        // traverse right
        print(node.right);
      }
    }
    console.log("===tree===");
    print(root);
    console.log("==========");
  };
}

// 1. Implement the Graph class.
class Graph {
    constructor(isDirected = false) {
        this.isDirected = isDirected;   
        this.vertices = [];             
        this.adjlist = new Map();       
    }

    addVertex(v) {
        if (!this.vertices.includes(v)) {  
            this.vertices.push(v);         
            this.adjlist.set(v, []);       
        }
    }

    addEdge(v, w) {
        if (!this.adjlist.get(v)) {
            this.addVertex(v);             
        }
        if (!this.adjlist.get(w)) {
            this.addVertex(w);             
        }
        this.adjlist.get(v).push(w);      
        if (!this.isDirected) {
            this.adjlist.get(w).push(v);   
        }
    }

    getVertices() {
        return this.vertices;
    }

    getAdjList() {
        return this.adjlist;
    }

    toString() {
        let s = '';
        for (let i = 0; i < this.vertices.length; i++) {     
            s += `${this.vertices[i]} -> `;
            const neighbors = this.adjlist.get(this.vertices[i]); 
            for (let j = 0; j < neighbors.length; j++) {       
                s += `${neighbors[j]} `;
            }
            s += '\n'; 
        }
        return s;
    }
}

    for (let i = 0; i < neighbors.length; i++) {

      }
    }

    color[vertex] = Colors.BLACK;           
  };

  dfsVisit(startVertex);                     
};

// 1. Implement Dijkstra's algorithm.
//    NOTE: Replace INF (used in the book) with Infinity.
const minDistance = (dist, visited) => {
  let min = Infinity;
  let minIndex = -1;

  for (let v = 0; v < dist.length; v++) {
    if (!visited[v] && dist[v] <= min) {
      min = dist[v];
      minIndex = v;
    }
  }
  return minIndex;
};

const dijkstra = (graph, src) => {
  const length = graph.length;
  const dist = Array(length).fill(Infinity); 
  const visited = Array(length).fill(false); 

  dist[src] = 0; 

  for (let i = 0; i < length - 1; i++) {
    const u = minDistance(dist, visited); 
    visited[u] = true; 

    for (let v = 0; v < length; v++) {
      if (
        !visited[v] &&
        graph[u][v] !== 0 &&
        dist[u] !== Infinity &&
        dist[u] + graph[u][v] < dist[v]
      ) {
        dist[v] = dist[u] + graph[u][v]; 
      }
    }
  }

  return dist; 
};
