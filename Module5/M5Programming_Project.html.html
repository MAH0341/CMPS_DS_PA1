// 1. Implement the tree data structure using the prototype (see below). Note

console.log("Project");

// Node constructor
function Node(key) {
  this.key = key;
  this.left = null;
  this.right = null;
}

// Binary Search Tree constructor
function BinarySearchTree() {
  this.root = null; // root node
}

// Helper function to insert a node
BinarySearchTree.prototype._insertNode = function(node, newNode) {
  if (newNode.key < node.key) {
    if (node.left === null) {
      node.left = newNode;
    } else {
      this._insertNode(node.left, newNode);
    }
  } else {
    if (node.right === null) {
      node.right = newNode;
    } else {
      this._insertNode(node.right, newNode);
    }
  }
};

// Public insert function
BinarySearchTree.prototype.insert = function(key) {
  const newNode = new Node(key);
  if (this.root === null) {
    this.root = newNode; 
  } else {
    this._insertNode(this.root, newNode);
  }
};

// In-order traversal (prints tree in sorted order)
BinarySearchTree.prototype.inOrderTraverse = function(callback) {
  function _inOrderTraverseNode(node) {
    if (node !== null) {
      _inOrderTraverseNode(node.left);
      callback(node.key);
      _inOrderTraverseNode(node.right);
    }
  }
  _inOrderTraverseNode(this.root);
};

// Function for printing node value

// 5. Implement the min method using the prototype and show that it works.
BinarySearchTree.prototype.min = function() {
  let current = this.root;
  if (current === null) return null; 
  while (current.left !== null) {
    current = current.left;
  }
  return current.key;
};

console.log("Minimum key:", tree.min());
// 6. Implement the max method using the prototype and show that it works.
BinarySearchTree.prototype.max = function() {
  let current = this.root;
  if (current === null) return null; 
  while (current.right !== null) {
    current = current.right;
  }
  return current.key;
};

// 7. Implement the search method using the prototype and show that it works.
BinarySearchTree.prototype.search = function(key) {
  function _searchNode(node, key) {
    if (node === null) return false;
    if (key < node.key) return _searchNode(node.left, key);
    else if (key > node.key) return _searchNode(node.right, key);
    else return true; 
  }
  return _searchNode(this.root, key);
};

// 13 Implement Prim's algorithm (use code from the book).
//    NOTE1: You do not need to use the code from (12) for this question.
//    NOTE2: Replace INF (used in the book) with Infinity.
console.log("Prim's Algorithm");

const minKey = (key, visited) => {
  let min = Infinity;
  let minIndex = -1;

  for (let v = 0; v < key.length; v++) {
    if (!visited[v] && key[v] < min) {
      min = key[v];
      minIndex = v;
    }
  }
  return minIndex;
};

const prim = (graph) => {
  const length = graph.length;
  const parent = Array(length).fill(null); 
  const key = Array(length).fill(Infinity); 
  const visited = Array(length).fill(false);

  key[0] = 0;      
  parent[0] = -1; 

  for (let i = 0; i < length - 1; i++) {
    const u = minKey(key, visited); 
    visited[u] = true;

    for (let v = 0; v < length; v++) {
      if (graph[u][v] !== 0 && !visited[v] && graph[u][v] < key[v]) {
        parent[v] = u;
        key[v] = graph[u][v];
      }
    }
  }

  return parent; 
};

  [0, 4, 0, 0, 0, 2],
  [0, 2, 3, 0, 0, 2],
  [0, 0, 0, 2, 2, 0]
];

const mst = prim(graph);
